name: Orange Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arfaynee
          outputs: |
            dist/snake.svg?color_snake=#FF6A00&color_dots=#F1F3F5,#FFDEBF,#FFC18B,#FF9950,#FF6A00
            dist/snake-dark.svg?color_snake=#FF8A25&color_dots=#15171E,#4B2613,#7B3D1A,#B85E23,#FF9C43

      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
